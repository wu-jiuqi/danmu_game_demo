<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 941 1672" role="img" aria-labelledby="title desc">
  <title id="title">百味饭馆 9:16 SVG 占位原型</title>
  <desc id="desc">依据冻结概念图绘制的夜市饭馆竖屏布局：资源栏、上层客人、中央厨房、用餐区、礼物能力槽和弹幕输入区。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#111b3b"/>
      <stop offset=".45" stop-color="#2d2850"/>
      <stop offset="1" stop-color="#7f3d4b"/>
    </linearGradient>
    <linearGradient id="roof" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#3d2840"/>
      <stop offset="1" stop-color="#17162b"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#a7634e"/>
      <stop offset=".52" stop-color="#5e342f"/>
      <stop offset="1" stop-color="#2d1c2b"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#2e315e" stop-opacity=".94"/>
      <stop offset="1" stop-color="#151935" stop-opacity=".95"/>
    </linearGradient>
    <linearGradient id="pink" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#ff8ac7"/>
      <stop offset="1" stop-color="#ec4f87"/>
    </linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#ffd47c"/>
      <stop offset="1" stop-color="#ff8a4e"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#9df5ff"/>
      <stop offset="1" stop-color="#4d8bff"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#0b0c20" flood-opacity=".48"/>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="9" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
